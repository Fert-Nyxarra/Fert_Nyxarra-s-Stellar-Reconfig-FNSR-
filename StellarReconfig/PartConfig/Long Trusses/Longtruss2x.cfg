	@node_stack_bottom01 = 0.0, -2.004, 0.0, 0.0, -1.0, 0.0, 3
	@MODEL
	{
		@scale = 1,2,1
	}
	@title = #LOC_LT2
	@manufacturer = #LOC_FNSR_NDA
	@description = #LOC_LT2Desc
