+PART[radiator-microchannel-fixed-1]:FOR[StellarReconfig]
{
	@name = customthickradiator-microchannel-fixed-1
	@title = #LOC_THICK
	@description = #LOC_THICKDesc
	@mass *= 3
	@cost *= 3
	@manufacturer = #LOC_FNSR_NDA
	@MODEL
	{
		%scale = 1,3,1
	}
	@MODULE[ModuleSystemHeat]:NEEDS[SystemHeat]
	{
		@volume *= 3
	}
}